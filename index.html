<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharater MP Directory</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; text-align: center; }
        header { background: #007bff; color: white; padding: 20px; border-radius: 5px; }
        .search-container { margin: 20px 0; }
        input { padding: 10px; width: 60%; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        .mp-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .mp-card { background: white; padding: 15px; border-radius: 8px; width: 250px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .mp-card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; }
        .mp-card h3 { margin: 10px 0 5px; color: #333; }
        .mp-card p { font-size: 14px; color: #666; margin: 5px 0; }
    </style>
</head>
<body>

    <header>
        <h1>🇮🇳 Indian Members of Parliament (MP) Dashboard</h1>
        <p>Bharater shob MP-der profile ebong tracking directory</p>
    </header>

    <div class="search-container">
        <input type="text" id="search" placeholder="Search by MP Name, State or Party..." onkeyup="filterMPs()">
    </div>

    <!-- MP Card List -->
    <div class="mp-list" id="mpList">
        
        <!-- Sample Card 1 -->
        <div class="mp-card" data-name="Abhishek Banerjee" data-state="West Bengal" data-party="AITC">
            <img src="https://placeholder.com" alt="MP Image">
            <h3>Abhishek Banerjee</h3>
            <p><strong>Constituency:</strong> Diamond Harbour</p>
            <p><strong>State:</strong> West Bengal</p>
            <p><strong>Party:</strong> AITC</p>
        </div>

        <!-- Sample Card 2 -->
        <div class="mp-card" data-name="Narendra Modi" data-state="Uttar Pradesh" data-party="BJP">
            <img src="https://placeholder.com" alt="MP Image">
            <h3>Narendra Modi</h3>
            <p><strong>Constituency:</strong> Varanasi</p>
            <p><strong>State:</strong> Uttar Pradesh</p>
            <p><strong>Party:</strong> BJP</p>
        </div>

    </div>

    <script>
        function filterMPs() {
            let input = document.getElementById('search').value.toLowerCase();
            let cards = document.getElementsByClassName('mp-card');
            
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name').toLowerCase();
                let state = cards[i].getAttribute('data-state').toLowerCase();
                let party = cards[i].getAttribute('data-party').toLowerCase();
                
                if (name.includes(input) || state.includes(input) || party.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
